# 템플릿입니다. 실제 sources.yaml 은 Phase 0 조사 뒤에 만듭니다.
#
# feed 아래의 lead_coverage / lead_median_chars / items_per_day / robots_allowed 는
# spikes/probe_sources.py 가 실측한 값만 적습니다. 비어 있으면 null 로 둡니다.
# 추측으로 채우면 P9 위반입니다.
#
# political_lean 에 unclassified 가 아닌 값을 넣으려면 lean_basis 에 외부 근거를
# 적어야 합니다 (P5). 근거를 못 찾으면 unclassified 가 정답입니다.
# 모델의 인상으로 좌/우를 매기지 마십시오.

sources:
  # --- 편집권 독립 매체: 정치성향 축이 유효한 경우 ---
  - id: guardian_world
    name: The Guardian (World)
    country: GB
    bloc: anglo
    language: en
    ownership: nonprofit            # Scott Trust 구조 — 확인 필요
    editorial_independence: independent
    political_lean: center_left
    lean_basis: "AllSides media bias rating (등급·조사연도 확인 필요)"
    role: source
    feed:
      kind: rss
      url: https://www.theguardian.com/world/rss
      lead_coverage: null           # Phase 0 실측 전
      lead_median_chars: null
      items_per_day: null
      robots_allowed: null
    tos_note: "미확인 — theguardian.com/help/terms-of-service 확인 필요"

  - id: dw_en
    name: Deutsche Welle (English)
    country: DE
    bloc: eu
    language: en
    ownership: public_broadcaster
    editorial_independence: independent
    political_lean: unclassified    # 근거를 못 찾았으면 이게 정답이다
    lean_basis: ""
    role: source
    feed:
      kind: rss
      url: https://rss.dw.com/rdf/rss-en-all
    tos_note: "미확인"

  # --- 국가통제 매체: P4. 배제하지 않고 라벨을 붙여 포함한다.
  #     해당 정부가 밀고 있는 프레임의 1차 사료로서 가치가 있기 때문이다.
  #     출력에서는 항상 이 라벨이 함께 표시되어야 한다.
  - id: globaltimes
    name: Global Times
    country: CN
    bloc: sinosphere
    language: en
    ownership: party_organ
    editorial_independence: state_controlled
    political_lean: state_line
    lean_basis: "RSF Press Freedom Index; 인민일보 계열 매체 (순위·연도 확인 필요)"
    role: source
    feed:
      kind: rss
      url: https://www.globaltimes.cn/rss/outbrain.xml
    tos_note: "미확인"

  - id: tass_en
    name: TASS (English)
    country: RU
    bloc: russia
    language: en
    ownership: state_owned
    editorial_independence: state_controlled
    political_lean: state_line
    lean_basis: "RSF Press Freedom Index; 러시아 국영통신사 (순위·연도 확인 필요)"
    role: source
    feed:
      kind: rss
      url: https://tass.com/rss/v2.xml
    tos_note: "미확인 — EU 제재 대상 매체 여부도 함께 확인할 것"

  # --- baseline: P6. 보도 공백 계산 전용.
  #     ★ 브리핑 본문에 절대 투입되지 않는다. role 로 구분되며,
  #       파이프라인은 role=source 만 클러스터링에 넣는다.
  - id: yonhap
    name: 연합뉴스
    country: KR
    bloc: other
    language: ko
    ownership: nonprofit
    editorial_independence: independent
    political_lean: unclassified
    lean_basis: ""
    role: baseline
    feed:
      kind: rss
      url: https://www.yna.co.kr/rss/news.xml
    tos_note: "미확인"

  - id: japantimes
    name: The Japan Times
    country: JP
    bloc: other
    language: en
    ownership: private
    editorial_independence: independent
    political_lean: unclassified
    lean_basis: ""
    role: baseline
    feed:
      kind: rss
      url: https://www.japantimes.co.jp/feed/
    tos_note: "미확인"
