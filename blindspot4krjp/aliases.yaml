# 개체 별칭 사전 — 교차언어 사건 매칭의 보조 신호 (ADR 0002)
#
# 왜 필요한가
#   다국어 임베딩만으로는 제목+리드 길이의 짧은 텍스트에서 사건 동일성이
#   불안정하다. "같은 개체가 등장하는가"는 사전만 있으면 언어를 넘어 확실하게
#   판정되고, 숫자 신호와 함께 임베딩의 재현율 부족을 메운다.
#
# 매칭 규칙 (src/blindspot/aliases.py 가 강제한다)
#   - 비라틴 표기(한글·가나·한자·키릴 등): 부분 문자열 일치. 최소 2자.
#   - 라틴 표기 5자 이상: 단어 경계 + 대소문자 무시.
#   - 라틴 표기 4자 이하: 단어 경계 + **대소문자 구분**.
#     "US"/"UN"/"EU" 를 영어 대명사 us, 프랑스어 관사 un, 로마자 eu 와
#     구분하기 위해 필요하다. 이 규칙이 없으면 오탐이 신호를 망친다.
#   - 1자 표기는 로드 시 거부된다.
#   - 두 개체가 같은 표기를 공유하면 로드 시 거부된다 (모호).
#
# 유지보수
#   - kind: person 항목은 선거·정변으로 무효화된다. volatile: true 로 표시하고
#     as_of 를 적는다. 주기적으로 검토해야 하는 항목이다.
#   - 일반 주제어(관세, 휴전, 선거, 지진 …)는 **넣지 않는다.** 모든 관세 기사가
#     모든 관세 기사와 매칭되어 신호가 무의미해진다. 고유명사만 넣는다.
#   - 간체/번체가 다르면 둘 다 적는다. 대만·홍콩 매체와 중국 매체의 표기가 다르다.
#   - 이 사전은 초안이다. 운영하면서 놓친 매칭을 보고 늘려 간다.
#
# 현재 상태: 라틴·한국어·일본어·중국어 표기는 비교적 촘촘하고,
#            프랑스어·독일어·러시아어는 드문드문하다. 해당 언어 소스를
#            채택하면 그 언어 표기를 보강해야 한다.

