[project]
name = "blindspot4krjp"
version = "0.0.1"
description = "국가 간 보도 지형 및 보도 공백 분석기"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
embed = ["sentence-transformers>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blindspot"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
