[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-nakoja"
version = "0.2.0"
description = "LLM-based Korea-Japan Relations Neutral Article Generator (경요세계 / 성신교린)"
authors = [
    { name = "Jiheon Baek", email = "fairyofdata@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "japan-korea", "nlp", "news-analysis", "neutrality", "streamlit", "openai"]

dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.7.0",
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "selenium>=4.15.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
